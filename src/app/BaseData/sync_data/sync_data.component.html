<div class="container mt-4">
  <h2 class="mb-4">Gérer les Paramètres</h2>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Espace de Travail</th>
        <th>Nom d'utilisateur</th>
        <th>Mot de passe</th>
        <th>Environnement</th>
        <th>Nom du Conteneur</th>
        <th>Chemin</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let param of params; let i = index">
        <td>{{ param.workspace }}</td>
        <td>
          <input
            *ngIf="editingIndex === i"
            [(ngModel)]="param.username"
            class="form-control"
          />
          <span *ngIf="editingIndex !== i">{{ param.username }}</span>
        </td>
        <td>
          <input
            *ngIf="editingIndex === i"
            [(ngModel)]="param.password"
            class="form-control"
          />
          <span *ngIf="editingIndex !== i">{{ param.password }}</span>
        </td>
        <td>
          <input
            *ngIf="editingIndex === i"
            [(ngModel)]="param.environment"
            class="form-control"
          />
          <span *ngIf="editingIndex !== i">{{ param.environment }}</span>
        </td>
        <td>
          <input
            *ngIf="editingIndex === i"
            [(ngModel)]="param.container_name"
            class="form-control"
          />
          <span *ngIf="editingIndex !== i">{{ param.container_name }}</span>
        </td>
        <td>
          <input
            *ngIf="editingIndex === i"
            [(ngModel)]="param.path"
            class="form-control"
          />
          <span *ngIf="editingIndex !== i">{{ param.path }}</span>
        </td>
        <td>
          <button
            *ngIf="editingIndex === i"
            class="btn btn-success btn-sm"
            (click)="saveChanges(i)"
          >
            Sauvegarder
          </button>
          <button
            *ngIf="editingIndex === i"
            class="btn btn-danger btn-sm"
            (click)="cancelEdit()"
          >
            Annuler
          </button>
          <button
            *ngIf="editingIndex !== i"
            class="btn btn-primary btn-sm"
            (click)="enableEdit(i)"
          >
            Modifier
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
